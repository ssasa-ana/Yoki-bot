name: Build from zip
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip and build
        run: |
          ZIP="$(ls YokiAIAssistant-v0*.zip | sort -V | tail -n 1)"
          echo "Building from $ZIP"
          unzip -o "$ZIP"
          cd YokiAIAssistant
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: YokiAIAssistant/app/build/outputs/apk/debug/app-debug.apk
